spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5433/devpilot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


spring.flyway.url=jdbc:postgresql://localhost:5433/devpilot
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.driver-class-name=org.postgresql.Driver

# Gemini API key
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

# Gemini chat
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

# Gemini embedding - NEW MODEL
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768


spring.main.web-application-type=servlet
spring.logging.level.org.springframework=DEBUG
spring.token.encryption.password=AQ.2J0g7k6Q4q8Z9Y5L1v3mN8pR0sW2xH5bG7cD9eF1hJ4kL2mN


#github OAuth2 configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

#Session and Cors Configuration
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

#App Configuration
spring.app.frontend.url=http://localhost:3000
app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50

#Postgres Vector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
